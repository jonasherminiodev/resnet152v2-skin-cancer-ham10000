<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Predição de Tipos de Câncer de Pele</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1 class="mb-4">Predição de Tipos de Câncer de Pele</h1>
        <form id="uploadForm" action="/" method="post" enctype="multipart/form-data">
            <div class="form-group">
                <label for="imageFile">Selecione uma imagem:</label>
                <input type="file" class="form-control-file" id="imageFile" name="file" accept="image/*" required>
            </div>
            <button type="submit" id="submitButton" class="btn btn-primary">Enviar</button>
        </form>
    
        <script>
            document.getElementById('imageFile').addEventListener('change', function() {
                document.getElementById('uploadForm').submit();
            });
        </script>
    <div style="float:left; width:300px;">
        {% if img_up %}
            <img src="{{ url_for('static', filename=img_up) }}"style="width:300px;">
        {% endif %}
    </div>
        <div class="mt-5">
            {% if results %}
            <h2>Resultados:</h2>
            <ul>
                {% for result in results %}
                <li>{{ result.class }}: {{ result.probability }}</li>
                {% endfor %}
            </ul>
            {% endif %}
        </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
